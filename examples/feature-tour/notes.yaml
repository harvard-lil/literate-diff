# A tour of every feature, on a small invented change: a service called
# "wren" moving from build-at-deploy to build-once, promote-by-digest, across
# an app repository and an infrastructure repository.
#
# Build from the repository root, because `diff:` and doc paths resolve from
# the current directory:
#
#   uv run literate-diff -a examples/feature-tour/notes.yaml \
#       -o examples/feature-tour/feature-tour.html
#
# `notes-v1.yaml` beside this file is the same document in the v1 shape
# (`plot:`, `chapters:`, `appendix:`), which still builds.

title: "Promote, do not rebuild"
subtitle: "A feature tour of literate-diff on an invented two-repository change"

# --- Brief -------------------------------------------------------------------
# Not rendered. Written before any prose, embedded with the sidecar, read by
# the lint and by anyone interrogating the file: who this is for and why.
brief:
  author: |
    Wanted the suite to run against the bytes that ship, and to stop carrying
    long-lived cloud keys in a public repository. Knew the registry could
    hold an image by digest; did not know whether promotion needed a service.
  learned: |
    Promotion needs no service; the registry already holds an image by
    digest, and two registry settings make promoting it safe.
  outside_the_record:
    - Priya's Slack message about the Friday deploy is a note (`ops-slack`).
  readers:
    - who: someone setting up a deploy elsewhere
      knows: Docker, CI; not this registry's tag rules
      does: copies the pattern, or does not
      asks: what do I have to set on the registry before promotion is safe?
    - who: whoever reviews the cloud configuration
      knows: IAM; not GitHub environments
      does: signs off on the trust policy, or sends it back
      asks: who can assume the deploy role now?
  beats:
    - the suite runs against the bytes that ship
    - a deploy is a tag, not a build
    - the deploy role trusts one environment, not every branch

# --- Sources -----------------------------------------------------------------
# Evidence. Each has a `type:`; the default is `diff`. Files are addressed as
# `source:path`. `label:` is the display name.
sources:
  app:
    diff: examples/feature-tour/app.patch
    label: wren
    range: prod...main
  infra:
    diff: examples/feature-tour/infra.patch
    label: wren-terraform
    range: main...deploy-by-digest
  chat:
    type: transcript
    file: conversations.yaml
    label: the conversation
  standards:
    type: doc
    label: standards
    files:
      - path: examples/feature-tour/deploy-standard.md
        title: The deploy standard this change follows
  said:
    type: notes
    label: things people said
    items:
      - id: ops-slack
        by: Priya
        on: 2026-03-01
        where: "#wren in Slack"
        text: |
          We shipped a build on Friday that the suite had never seen, because
          the deploy rebuilt from source after the tests passed on a different
          image. Second time this month.
      - id: cdn-drain
        by: Sam
        text: |
          Cloudflare answers 524 at about 100 seconds, so an origin drain longer
          than that waits for clients that have already gone.
        url: https://developers.cloudflare.com/support/troubleshooting/http-status-codes/cloudflare-5xx-errors/error-524/
  glossary:
    type: terms
    items:
      - term: digest
        aliases: [digests]
        text: |
          The hash of an image's manifest. It names exactly one set of bytes,
          where a tag is a movable name that points at whatever it pointed at
          that day.
      - term: promotion
        aliases: [promote, promotes, promoted]
        text: |
          Marking an image the suite has passed as deployed by adding a tag to
          its digest. No copy is made and no second build happens.
      - term: OIDC
        text: |
          OpenID Connect. A CI job presents a signed token stating which
          repository, branch or environment it runs for, and a cloud role's
          trust policy says which such subjects may assume it. Replaces
          long-lived access keys stored as secrets.

# --- Categories --------------------------------------------------------------
# Kinds of win, for the lists in the wins layer. Colours default to a palette
# that stays distinguishable under colour-vision deficiency; `color:`
# overrides, `short:` prefixes the number where colour alone should not carry it.
categories:
  security:    {label: Security, short: S}
  correctness: {label: Correctness, short: C}
  reliability: {label: Reliability, short: R}
  regression:  {label: Regression, short: X, color: "#555555"}
  future:      {label: Future work, short: F, color: "#BBBBBB"}

# --- Layers ------------------------------------------------------------------
# The debrief, top to bottom, in three groups: summary (what the author wants
# the reader to know), synthesis (why the author believes it), evidence (what
# happened). `row:` orders rows within a group; the map draws the shape. A
# title is a noun naming the block; `subtitle:` says what it contains and
# where it came from. `audience:` and `budget:` are metadata for the brief,
# the lint and the cold read, shown on hover in the map, not in the header.
# A prose layer's text is markdown; `{claims}` on the line before a list makes
# each item a claim that shows what it rests on.
layers:
  - id: summary
    group: summary
    title: Executive summary
    subtitle: What changed, for anyone.
    audience: anyone
    budget: 1 minute
    claims: required
    text: |
      {claims}
      * **The suite runs against the bytes that ship.** CI used to build one
        image to test and the deploy built another from the same source
        [](ld:#ops-slack); now it builds one, tests the `test` stage on top of
        it, and the deploy ships the image that passed [](ldc:#same-bytes).
      * **A deploy is a tag, not a build**, so it takes seconds rather than
        minutes and cannot produce something the suite has not seen
        [](ld:#q-promotion).
      * **No AWS keys in the workflow.** The job assumes a role through
        GitHub's OIDC provider, and the trust policy names one environment
        rather than every branch in the repository [](ld:#cat-oidc)
        [](ld:#doc-deploy-standard.md).

  - id: builders
    group: summary
    row: 2
    title: Deploy builders
    subtitle: What to reuse, and the habit to drop, when setting up a deploy elsewhere.
    audience: someone about to build the next deploy
    budget: 2 minutes
    text: |
      Promotion needs no service: the registry stores an image by digest, so
      shipping a tested image means adding a tag to a digest that is already
      there [](ld:#q-promotion). Two registry settings make it safe -- immutable
      tags, and a lifecycle policy that expires deployed images more slowly
      than candidates. Drop the habit of copying a settings module in at
      build time; choose it at runtime and the second Dockerfile goes away
      [](ld:#q-settings). The [deploy standard](ld:#doc-deploy-standard.md)
      says the same in four paragraphs.

  - id: iam
    group: summary
    row: 2
    title: IAM reviewers
    subtitle: The one trust-policy change, and why it is narrower than before.
    audience: whoever reviews the cloud configuration
    budget: 1 minute
    text: |
      A deploy role whose trust policy names a branch can be assumed from any
      pushed branch. Name the environment instead [](ldc:#oidc).

  - id: overview
    group: synthesis
    title: Overview
    subtitle: What was true before, what is true now, and the property the change is organised around.
    audience: a colleague in another role
    budget: 3 minutes
    text: |
      Before this change, every deploy built a fresh image on the `prod`
      branch and pushed it as `latest`, with production settings copied into
      the image at build time and long-lived AWS keys in the workflow. The
      suite never ran against the bytes that shipped, which is how
      [](ldq:#ops-slack)

      After it, CI builds one image per commit, tests the `test` stage that
      is built from `prod`, and publishes it tagged with the commit. The
      deploy resolves that tag to a digest and ships the digest. The registry
      refuses to move a commit tag, keeps deployed images longer than
      candidates, and the deploy role trusts one GitHub environment rather
      than every branch.

      The change was [asked for as a question about testing what
      ships](ldq:#q-promotion-prompt), and the two properties that make
      promotion safe [came back with the answer](ld:#q-promotion-response).

  - id: narrative
    group: synthesis
    title: Work narrative
    subtitle: The decisions and turning points, in the order they arrived, from the conversation and the code.
    audience: someone judging the work
    budget: 3 minutes
    text: |
      **1. Testing what ships** (Monday). Every deploy rebuilt from source on
      the `prod` branch, so what shipped had never been tested. The answer
      was that no promotion service was needed, because the registry already
      stores an image by digest: [](ldq:#p-promotion) *The work moved from
      building a mechanism to making two registry properties safe.*

      **2. The keys, asked as an aside** (Monday). Noticed in passing rather
      than planned [](ld:#q-oidc), and answered in the same batch.
      *Long-lived AWS keys left the workflow.*

      **3. One image for every tier** (Tuesday). The settings module was
      copied in at build time, which is why there were two Dockerfiles
      [](ld:#q-settings). *Choosing at runtime removed the second file and
      let `test` be built from `prod`.*

      The chapters run in dependency order: the registry has to accept
      immutable tags before the workflow can rely on them.

  - id: improvements
    group: synthesis
    title: Improvements
    subtitle: Every win by kind, each stating what was true before and what is true now.
    audience: someone reviewing the change
    budget: 3 minutes
    text: |
      Each item recurs as a coloured number where it is delivered; hover the
      number to see the item, click to come back. Each item lists where it is
      flagged.

      ### Security

      {category: security}
      1. {#oidc} Before, the deploy trusted `repo:example/wren:*`, so any
         branch could assume the deploy role. It now trusts the `prod`
         environment only.
      2. {#no-keys} Before, the workflow carried long-lived access keys as
         repository secrets. It now assumes a role over OIDC.
      3. {#sha-pins} Before, actions were referenced by tag. They are pinned
         to a commit SHA.

      ### Correctness

      {category: correctness}
      1. {#same-bytes} Before, the deploy rebuilt the image, so the bytes
         tested and the bytes shipped were two builds of the same source. The
         deploy now promotes the image CI tested, by digest.
      2. {#runtime-settings} Before, the production settings module was
         copied over `settings.py` at build time, so one image could only
         ever be production. The module is named at runtime, and one image
         boots as any tier.

      ### Reliability

      {category: reliability}
      1. {#immutable} Before, a re-run could repoint a commit tag at
         different bytes. Commit tags are immutable; only `latest` moves.
      2. {#retention} Before, "keep last 5" expired the image production was
         running as soon as five more merges landed. Deployed images now age
         on their own rule.
      3. {#health} Before, health checks ran once a minute and old tasks
         drained for five minutes. Checks run every 15 seconds and the drain
         is 120, since [the CDN gives up on an origin at about
         100](ld:#cdn-drain).

  - id: other-side
    group: synthesis
    title: Regressions and future work
    subtitle: What got worse or was traded away, and what is left to do.
    audience: someone reviewing the change
    budget: 1 minute
    text: |
      ### Regressions

      {category: regression}
      1. {#first-build} The dev image is no longer pulled, so a first
         checkout builds it, and a dependency change rebuilds it.
      2. {#no-maintenance} The maintenance page went with the second target
         group. There is no maintenance mode until an edge-served one exists.

      ### Future work

      {category: future}
      1. {#edge-maint} A maintenance page held at the CDN, so it works when
         the origin is down; see [Regression 2](ld:#cat-no-maintenance).
      2. {#static} Compiled assets served from a bucket rather than the
         container, so a rolling deploy cannot 404 on a bundle from the
         other version.

  - id: vocabulary
    kind: stream
    group: synthesis
    title: Vocabulary
    subtitle: The terms used above, defined for this change; linked from their first use in each block.
    sources: [glossary]

  - id: code
    kind: stream
    group: evidence
    title: Code
    subtitle: The annotated diff across the app and infrastructure repositories, in dependency order.
    audience: someone reviewing the change line by line
    sources: [app, infra]
    hide:
      - "**/dist/**"            # generated output; a bare glob matches in every source
    collapse:
      - "app:requirements.lock" # rendered, but folded shut
      - "app:NOTES"
      - "infra:maintenance-page.png"
      - "infra:variables.tf"
    # Titled runs of files in reading order. `*` takes whatever is left.
    chapters:
      - id: registry
        title: "1. A registry that keeps its promises"
        note: |
          Promotion by digest is only safe if tags cannot move, and only
          useful if the promoted image survives. Both are properties of the
          registry, so they come first. The long-lived keys went in the [same
          sweep](ld:#q-oidc).
        files:
          - infra:ecr.tf
          - infra:iam.tf
      - id: image
        title: "2. One image for every tier"
        note: |
          The Dockerfile and the settings selector. Nothing in the workflow
          can promote an artifact until there is one artifact.
        files:
          - app:Dockerfile
          - app:app/__init__.py
          - app:app/settings.py
          - app:app/settings_prod.py
      - id: deploy
        title: "3. The deploy stops building"
        note: |
          With the two chapters above in place, the workflow can resolve a
          tag to a digest and ship it. This is the only file where the change
          is visible as a change in what the service does.
        files:
          - app:.github/workflows/deploy.yml
          - infra:ingress.tf
          - infra:maintenance.tf
      - title: "Housekeeping"
        note: |
          Dependency bumps, the README, a binary, and generated output.
          Folded shut; the lock file and the binary are here for
          completeness.
        files:
          - "*"

  - id: conversation
    kind: stream
    group: evidence
    title: Conversation
    subtitle: The prompts and replies the decisions turned on, in order, across two sessions.
    audience: someone following how a decision was reached
    sources: [chat]
    note: |
      Four turns of an invented conversation, interleaved by time across two
      sessions: the part of each prompt and reply the decision turned on,
      with the rest one click away, and a band of counts where the work
      itself was.
    # Chapters here are the subject, not the session: the stream is
    # chronological, so a chapter is fixed by the turn it opens at.
    chapters:
      - id: mechanism
        at: promotion:t0302-0914
        title: "Deciding to promote rather than rebuild"
      - id: runtime
        at: aside:t0303-0900
        title: "One image for every tier"

  - id: references
    kind: stream
    group: evidence
    title: Standards and statements
    subtitle: The deploy standard this follows, and what people said outside the record.
    audience: someone checking what a claim rests on
    sources: [standards, said]

# --- Files -------------------------------------------------------------------
# Per-file annotations for the diff sources. (`items:` under a layer is the
# same thing; this key is the older spelling and still works.)
files:
  infra:ecr.tf:
    title: immutable tags, split retention
    note: |
      The two registry properties the rest of the change depends on
      [](ldc:#immutable) [](ldc:#retention). The deploy's
      [resolve step](ld:#resolve) is what reads them.
    sections:
      - at: "Two populations age at different rates"
        id: retention-split
        title: "Deployed images and build candidates on separate rules"
        note: |
          A single count cannot serve both: sized for candidate churn it
          expires images still in service, sized for deployments it keeps
          every candidate forever.
    notes:
      - at: "IMMUTABLE_WITH_EXCLUSION"
        span: 5
        text: |
          Commit tags cannot be repointed; `latest` can, because the task
          definition Terraform writes still names it.
      - at: "tagPrefixList"
        span: 1
        text: |
          The `deployed-` prefix a deploy writes. An image claimed by a lower
          rule number is exempt from every later rule.
      - at: '"keep last 5 images"'
        span: 1
        text: |
          What was there before: five images, any tag, which is about two
          deploys of history.

  infra:iam.tf:
    title: who may deploy
    note: |
      One trust-policy condition [](ldc:#oidc). The old wildcard is
      [quoted here](ldq:#old-subject) so the reader need not scroll.
    anchors:
      - id: old-subject
        at: "StringLike"
        span: 1
    notes:
      - at: "environment:prod"
        span: 1
        text: |
          A job that names a GitHub environment presents `environment:<name>`
          as its subject, so the environment's branch policy decides who
          reaches this role.

  app:Dockerfile:
    title: four stages, one build graph
    collapsed: false
    note: |
      `test` is built from `prod`, so the suite runs against the layers that
      ship [](ldc:#same-bytes). Settings are chosen at runtime
      [](ldc:#runtime-settings), which is what lets one image be both the
      test target and the production artifact.
    sections:
      - at: "FROM base AS prod"
        id: stage-prod
        title: "prod: the artifact that ships"
      - at: "FROM prod AS test"
        id: stage-test
        title: "test: what CI runs the suite against"
        note: |
          Everything below `prod` is test toolchain. The bytes above it are
          exactly what production runs.
      - at: "FROM base AS dev"
        title: "dev: built locally, working tree mounted over it"
        note: |
          Built on a laptop rather than pulled [](ldc:#first-build).
    notes:
      - at: "RUN cp app/settings_prod.py app/settings.py"
        span: 1
        id: bake-settings
        text: |
          The line that made the old image production-only. Anchors match
          row text without the leading `+` or `-`.
      - at: "ENV WREN_SETTINGS_MODULE=settings_prod"
        span: 1
        text: |
          The default, overridable by CI for the same image; see
          [the selector](ld:#file-app-app-__init__.py).

  app:app/__init__.py:
    title: the settings selector
    note: |
      Reads the module name from the environment [](ldc:#runtime-settings).
      Replaces the [copy at build time](ldq:#bake-settings).
    notes:
      - at: "/settings_dev/"
        span: 1
        text: |
          A regex anchor. The fallback for a developer's checkout, where the
          variable is unset.

  app:app/settings.py:
    note: |
      The file the old Dockerfile overwrote. Nothing reads it now.

  app:app/settings_prod.py:
    note: |
      Static files move to a bucket [](ldc:#static); only `STATIC_URL`
      changes here.
    notes:
      - at: "+4"
        span: 1
        text: |
          Anchored by new-side line number: line 4 of the new file.

  app:.github/workflows/deploy.yml:
    title: promote, do not rebuild
    collapsed: false
    note: |
      The payoff. The build step is gone; the deploy resolves the commit's
      tag to a digest [](ldc:#same-bytes) and ships that. Authenticated by
      OIDC [](ldc:#no-keys), on a pinned action [](ldc:#sha-pins).
    sections:
      - at: "Promote, do not rebuild: resolve the commit's tag to a digest"
        id: resolve
        title: "Resolve the tested image"
        note: |
          Digests, not tags, wherever the choice exists. This only works
          because [the registry](ld:#retention-split) keeps the image and
          refuses to move the tag.
    notes:
      - at: "AWS_ACCESS_KEY_ID"
        span: 2
        text: |
          Long-lived keys, removed [](ldc:#no-keys).
      - at: "environment: prod"
        span: 1
        text: |
          Naming the environment is what changes the OIDC subject the
          [trust policy](ld:#file-infra-iam.tf) matches [](ldc:#oidc).
      - at: "uses: actions/checkout@"
        nth: 2
        span: 1
        text: |
          Pinned to a commit, with the version in a comment for humans
          [](ldc:#sha-pins). `nth: 2` picks the added row over the removed
          one above it, which matches the same text.
      - at: "docker build -t"
        through: "docker push"
        text: |
          The build at deploy time, gone. `through:` extends this note to the
          next matching row.

  infra:ingress.tf:
    title: faster checks, shorter drain
    note: |
      Renamed from `alb.tf`; the badge says so. Timing changes only
      [](ldc:#health).
    notes:
      - at: "interval = 15"
        span: 2
        text: |
          Healthy threshold times interval is the floor on time-to-healthy.
      - at: "deregistration_delay"
        span: 1
        text: |
          [](ldq:#cdn-drain)

  infra:maintenance.tf:
    title: the maintenance page, removed
    note: |
      Two always-on resources serving nothing, gone [](ldc:#no-maintenance).
      The edge-served replacement is [future work](ld:#cat-edge-maint).
    notes:
      - at: "@0"
        span: 1
        text: |
          Anchored by row index: the first row of this file's diff, whatever
          it is.

  app:README.md:
    note: |
      What a developer sees [](ldc:#first-build).
    notes:
      - at: "-5"
        span: 1
        text: |
          Anchored by old-side line number: line 5 of the old file, the
          sentence that no longer holds.

  app:requirements.txt:
    note: |
      A dependency bump that rides along.

  app:requirements.lock:
    note: |
      Collapsed by the `collapse:` list, since nobody reads a lock file.

  app:NOTES:
    note: |
      A file with no newline at the end; the marker renders as a message row.

  infra:maintenance-page.png:
    note: |
      A binary; the payload is not shown.

  infra:variables.tf:
    note: |
      New, and folded shut.

# --- Turns -------------------------------------------------------------------
# Per-turn annotations for the transcript source. A turn is addressed as
# `thread:turn`; the highlight (`prompt:`/`response:`) is the part that
# shows, and may be several passages.
threads:
  promotion:
    note: |
      Two sessions, the second resumed after the first was compacted.
  aside:
    note: |
      A separate session, opened to check one thing.

turns:
  promotion:t0302-0914:
    id: q-promotion
    prompt: {at: "How hard is it to test one image"}
    response:
      - {at: "Promotion is a tag, not a copy"}
      - {at: "The work is in the two things", through: "before you need it"}
    anchors:
      - {id: p-promotion, at: "Promotion is a tag, not a copy", in: response}

  promotion:t0302-1042:
    id: q-oidc
    note: |
      Asked as an aside, and answered in the same batch.
    prompt: {at: "the workflow has AWS keys"}
    response: {at: "the trust policy names one environment"}

  promotion:t0303-1530:
    id: q-settings
    prompt: {at: "Can the image choose at runtime?"}
    response: {at: "it removes the second Dockerfile"}
    anchors:
      - {id: q-settings-why, at: "the `test` stage can be built from `prod`", in: response}
