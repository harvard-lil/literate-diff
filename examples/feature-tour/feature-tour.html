<!doctype html>
<!--
Debrief: Promote, do not rebuild

One HTML file, no external requests, built with literate-diff. Three parts:
summary (what the author wants the reader to know), synthesis (why the
author believes it, each claim citing evidence), evidence (what happened:
the code diff, the conversation, statements and documents, embedded whole).
Use it as a knowledge base: answer questions from the summary and synthesis
layers, and check any claim against the evidence it cites.

Layers, top to bottom (group / id / title):
  summary   #summary  Executive summary — What changed, for anyone.  (anyone · 1 minute)
  summary   #builders  Deploy builders — What to reuse, and the habit to drop, when setting up a deploy elsewhere.  (someone about to build the next deploy · 2 minutes)
  summary   #iam  IAM reviewers — The one trust-policy change, and why it is narrower than before.  (whoever reviews the cloud configuration · 1 minute)
  synthesis #overview  Overview — What was true before, what is true now, and the property the change is organised around.  (a colleague in another role · 3 minutes)
  synthesis #narrative  Work narrative — The decisions and turning points, in the order they arrived, from the conversation and the code.  (someone judging the work · 3 minutes)
  synthesis #improvements  Improvements — Every win by kind, each stating what was true before and what is true now.  (someone reviewing the change · 3 minutes)
  synthesis #other-side  Regressions and future work — What got worse or was traded away, and what is left to do.  (someone reviewing the change · 1 minute)
  synthesis #vocabulary  Vocabulary — The terms used above, defined for this change; linked from their first use in each block.
  evidence  #code  Code — The annotated diff across the app and infrastructure repositories, in dependency order.  (someone reviewing the change line by line)
  evidence  #conversation  Conversation — The prompts and replies the decisions turned on, in order, across two sessions.  (someone following how a decision was reached)
  evidence  #references  Standards and statements — The deploy standard this follows, and what people said outside the record.  (someone checking what a claim rests on)

Sources:
  app: diff prod...main
  infra: diff main...deploy-by-digest
  chat: transcript
  standards: doc
  said: notes
  glossary: terms

The data block <script type="application/json" id="ld-data"> holds the
sidecar (YAML, the annotations), each source's copy of record (a .patch,
a transcript YAML), the brief, and every claim with its evidence, as JSON
with `<` escaped as \u003c. Read it with:

  pup 'script#ld-data text{}' < page.html | jq '.claims[] | select(.supported|not)'
  htmlq -t '#ld-data' -f page.html | jq -r .sidecar
  python3 -c 'import sys,json,re;h=open(sys.argv[1]).read();print(json.loads(re.search(r"id=\"ld-data\">({.*?)</script>",h,re.S).group(1))["sidecar"])' page.html

Or with the tool (uvx --from git+https://github.com/harvard-lil/literate-diff literate-diff):

  literate-diff extract page.html --about      # this, as text
  literate-diff extract page.html --layer <id> # one layer as markdown, quotes resolved
  literate-diff extract page.html --claims     # every claim, its evidence, its kinds
  literate-diff extract page.html --to dir/    # sidecar and sources; rebuild from dir/

Ids: `ld:#id` links, `ldq:#id` quotes, `ldc:#id` flags a claim where it is
delivered. Row ids in the page are <body>-r<n>; anchors map ids to rows
in ld-data.presentation. The page is rendered from that data block.
-->

     aws-region: us-east-1\n+      # Promote, do not rebuild: resolve the commit's tag to a digest.\n+      - name: Resolve the tested image\n+        id: resolve\n         run: |\n-          docker build -t $REGISTRY/wren:latest .\n-          docker push $REGISTRY/wren:latest\n-      - name: Deploy\n-        run: aws ecs update-service --cluster wren --service wren --force-new-deployment\n+          digest=$(aws ecr describe-images --repository-name wren \\\n+            --image-ids imageTag=${{ github.sha }} \\\n+            --query 'imageDetails[0].imageDigest' --output text)\n+          echo \"digest=$digest\" >> \"$GITHUB_OUTPUT\"\n+      - name: Deploy the digest-pinned task definition\n+        run: ./scripts/deploy.sh \"wren@${{ steps.resolve.outputs.digest }}\"\ndiff --git a/Dockerfile b/Dockerfile\nindex 0883488..71f6ff2 100644\n--- a/Dockerfile\n+++ b/Dockerfile\n@@ -1,7 +1,19 @@\n-FROM python:3.12-slim\n+# base: dependencies only. Shared by every stage below.\n+FROM python:3.12-slim AS base\n WORKDIR /app\n COPY requirements.txt .\n-RUN pip install -r requirements.txt\n+RUN pip install --no-cache-dir -r requirements.txt\n+\n+# prod: the artifact that ships. Settings are chosen at runtime.\n+FROM base AS prod\n COPY app/ ./app\n-RUN cp app/settings_prod.py app/settings.py\n+ENV WREN_SETTINGS_MODULE=settings_prod\n CMD [\"gunicorn\", \"app.wsgi\"]\n+\n+# test: prod plus the test toolchain, so CI tests the bytes that ship.\n+FROM prod AS test\n+RUN pip install --no-cache-dir pytest\n+\n+# dev: base plus the toolchain, with the working tree mounted over it.\n+FROM base AS dev\n+RUN pip install --no-cache-dir pytest\ndiff --git a/NOTES b/NOTES\nnew file mode 100644\nindex 0000000..cd77cc6\n--- /dev/null\n+++ b/NOTES\n@@ -0,0 +1 @@\n+no newline at the end\n\\ No newline at end of file\ndiff --git a/README.md b/README.md\nindex ed85755..5a2cd94 100644\n--- a/README.md\n+++ b/README.md\n@@ -1,5 +1,6 @@\n # wren\n \n-Run `docker compose up` and visit http://local ,"repo":"examples/feature-tour/infra.patch","files":{"infra.patch":"diff --git a/ecr.tf b/ecr.tf\nindex 3c9c4fe..a4d723f 100644\n--- a/ecr.tf\n+++ b/ecr.tf\n@@ -1,16 +1,30 @@\n resource \"aws_ecr_repository\" \"wren\" {\n-  name                 = \"wren\"\n-  image_tag_mutability = \"MUTABLE\"\n+  name = \"wren\"\n+  # SHA tags name a tested build and must not move; `latest` stays a pointer.\n+  image_tag_mutability = \"IMMUTABLE_WITH_EXCLUSION\"\n+  image_tag_mutability_exclusion_filter {\n+    filter      = \"latest\"\n+    filter_type = \"WILDCARD\"\n+  }\n }\n \n+# Two populations age at different rates: deployed images and candidates.\n resource \"aws_ecr_lifecycle_policy\" \"wren\" {\n   repository = aws_ecr_repository.wren.name\n   policy = jsonencode({\n-    rules = [{\n-      rulePriority = 1\n-      description  = \"keep last 5 images\"\n-      selection    = { tagStatus = \"any\", countType = \"imageCountMoreThan\", countNumber = 5 }\n-      action       = { type = \"expire\" }\n-    }]\n+    rules = [\n+      {\n+        rulePriority = 1\n+        description  = \"Keep the last 20 deployed images, for rollback\"\n+        selection    = { tagStatus = \"tagged\", tagPrefixList = [\"deployed-\"], countType = \"imageCountMoreThan\", countNumber = 20 }\n+        action       = { type = \"expire\" }\n+      },\n+      {\n+        rulePriority = 2\n+        description  = \"Keep the last 20 build candidates\"\n+        selection    = { tagStatus = \"any\", countType = \"imageCountMoreThan\", countNumber = 20 }\n+        action       = { type = \"expire\" }\n+      },\n+    ]\n   })\n }\ndiff --git a/iam.tf b/iam.tf\nindex 0cebbe5..79502d8 100644\n--- a/iam.tf\n+++ b/iam.tf\n@@ -6,7 +6,8 @@ resource \"aws_iam_role\" \"deploy\" {\n       Principal = { Federated = var.github_oidc_provider_arn }\n       Action    = \"sts:AssumeRoleWithWebIdentity\"\n       Condition = {\n-        StringLike = { \"token.actions.githubusercontent.com:sub\" = \"repo:example/wren:*\" }\n+        # The prod environment only. `repo:example/wren:*` let any branch in.\n+        StringEquals = { \"token.actions.githubusercontent.com:sub\" = \"repo:example/wren:environment:prod\" }\n       }\n     }]\n   })\ndiff --git a/alb.tf b/ingress.tf\nsimilarity index 71%\nrename from alb.tf\nrename to ingress.tf\nindex eb49ba9..d699e80 100644\n--- a/alb.tf\n+++ b/ingress.tf\n@@ -11,7 +11,9 @@ resource \"aws_lb_target_group\" \"wren\" {\n   vpc_id   = var.vpc_id\n   health_check {\n     path     = \"/healthcheck/\"\n-    interval = 60\n-    timeout  = 30\n+    interval = 15\n+    timeout  = 5\n   }\n+  # Cloudflare gives up on an origin at about 100 seconds.\n+  deregistration_delay = 120\n }\ndiff --git a/maintenance-page.png b/maintenance-page.png\ndeleted file mode 100644\nindex 8c9957b..0000000\nBinary files a/maintenance-page.png and /dev/null differ\ndiff --git a/maintenance.tf b/maintenance.tf\ndeleted file mode 100644\nindex 1490623..0000000\n--- a/maintenance.tf\n+++ /dev/null\n@@ -1,14 +0,0 @@\n-# A second target group and an always-on task serving a maintenance page.\n-resource \"aws_lb_target_group\" \"maintenance\" {\n-  name     = \"wren-maintenance\"\n-  port     = 8080\n-  protocol = \"HTTP\"\n-  vpc_id   = var.vpc_id\n-}\n-\n-resource \"aws_ecs_service\" \"maintenance\" {\n-  name            = \"wren-maintenance\"\n-  cluster         = aws_ecs_cluster.wren.name\n-  task_definition = aws_ecs_task_definition.maintenance.arn\n-  desired_count   = 1\n-}\ndiff --git a/variables.tf b/variables.tf\nnew file mode 100644\nindex 0000000..cbf9620\n--- /dev/null\n+++ b/variables.tf\n@@ -0,0 +1,3 @@\n+variable \"subnets\" { type = list(string) }\n+variable \"vpc_id\" { type = string }\n+variable \"github_oidc_provider_arn\" { type = string }\n"}},"chat":{"type":"transcript","label":"the conversation","range":"","repo":"","files":{"conversations.yaml":"# literate-diff transcript.\n#\n# Collected from local agent session logs, which are neither shared nor\n# permanent -- this file is the copy of record. Read it before it goes\n# anywhere: prompts and replies quote whatever was on screen at the time.\n# Editing is expected. Cut turns, redact lines, fix a title.\n#\n# This one is invented, like the two patches beside it.\ncollected: 2026-03-04T18:00:00Z\ntool: claude-code\n# Timestamps below are UTC, as the logs record them. `timezone` is the\n# clock they are shown on, and the one the turn ids were derived from.\ntimezone: America/New_York\nthreads:\n  - id: promotion\n    title: \"Promoting an image instead of rebuilding it\"\n    sessions: [aaaa1111, bbbb2222]\n    turns:\n      - id: t0302-0914\n        at: 2026-03-02T09:14:00Z\n        session: aaaa1111\n        prompt: |-\n          Every deploy rebuilds from source on the prod branch, so what ships\n          has never been tested. How hard is it to test one image and then ship\n          that same image? I don't want to invent a promotion service for it.\n        response: |-\n          Not hard, and no service is needed. Promotion is a tag, not a copy:\n          the registry already stores the image by digest, so \"promote\" means\n          adding a second tag to a digest that is already there.\n\n          The work is in the two things that make that safe. Tags have to be\n          immutable, or a commit tag can be moved under you between test and\n          deploy. And the lifecycle policy has to expire deployed images more\n          slowly than candidates, or the thing you want to roll back to is\n          collected before you need it.\n        work: {seconds: 214, tokens: 4120}\n        tools: {Bash: 12, Read: 4}\n        narration:\n          - |-\n            Reading the workflow and the registry configuration first.\n\n      - id: t0302-1042\n        at: 2026-03-02T10:42:00Z\n        session: aaaa1111\n        prompt: |-\n          Do it, and while you're in there the workflow has AWS keys in it.\n          Can those go?\n        response: |-\n          Gone. The job now assumes a role through the GitHub OIDC provider,\n          and the trust policy names one environment rather than every ref in\n          the repository, so a workflow on a pushed branch cannot assume it.\n        work: {seconds: 431, tokens: 8830}\n        tools: {Bash: 22, Edit: 9}\n        attachments: [\"deploy.yml\"]\n\n      - id: t0303-1530\n        at: 2026-03-03T15:30:00Z\n        session: bbbb2222\n        prompt: |-\n          One more: the settings module is copied in at build time, which is\n          why there are two Dockerfiles. Can the image choose at runtime?\n        response: |-\n          Yes, and it removes the second Dockerfile. The module is selected\n          from an environment variable at startup, so one image runs in every\n          tier and the `test` stage can be built from `prod`.\n        work: {seconds: 96, tokens: 2210, thinking: 1840}\n        tools: {Bash: 6, Edit: 3}\n        events: 1\n\n  - id: aside\n    title: \"Checking what the registry charges for\"\n    sessions: [cccc3333]\n    turns:\n      - id: t0303-0900\n        at: 2026-03-03T09:00:00Z\n        prompt: |-\n          Separate question, asked here so it doesn't drag the other session\n          around: if we keep every commit's image, what does that cost?\n        response: |-\n          Not much, and the lifecycle policy is the lever.\n\n          | population | rule | kept |\n          |---|---|---|\n          | candidates | `sha-` prefix | 30 |\n          | deployed | `staging-`, `prod-` | 100 |\n\n          At this image size that is a few dollars a month, which is\n          below the noise floor of the account. The reason to expire anything\n          is not cost; it is that an unbounded repository makes `describe-images`\n          slow enough to time out in the deploy.\n        work: {seconds: 61, tokens: 1180}\n        tools: {Bash: 4}\n"}},"standards":{"type":"doc","label":"standards","range":"","repo":"","files":{"deploy-standard.md":"# Deploy standard\n\nEvery service ships one image per commit. CI builds it once, runs the suite\nagainst a test stage layered on top of it, and publishes it tagged with the\ncommit. A deploy promotes an image the suite has passed; it never builds.\n\n## Registry\n\nCommit tags are immutable. Only the per-tier moving tags may be repointed.\nDeployed images expire on their own rule, more slowly than build candidates,\nso a rollback target is still there when it is needed.\n\n## Identity\n\nA deploy job assumes a role through the platform's OIDC provider. The role's\ntrust policy names one deployment environment, not a branch pattern. No\nlong-lived cloud credentials are stored as repository secrets.\n\n## Settings\n\nAn image chooses its settings at runtime from the environment. Nothing is\ncopied into the image at build time that would make it tier-specific.\n"}},"said":{"type":"notes","label":"things people said","range":"","repo":"","files":{}},"glossary":{"type":"terms","label":"glossary","range":"","repo":"","files":{}}},"sidecar":"# A tour of every feature, on a small invented change: a service called\n# \"wren\" moving from build-at-deploy to build-once, promote-by-digest, across\n# an app repository and an infrastructure repository.\n#\n# Build from the repository root, because `diff:` and doc paths resolve from\n# the current directory:\n#\n#   uv run literate-diff -a examples/feature-tour/notes.yaml \\\n#       -o examples/feature-tour/feature-tour.html\n#\n# `notes-v1.yaml` beside this file is the same document in the v1 shape\n# (`plot:`, `chapters:`, `appendix:`), which still builds.\n\ntitle: \"Promote, do not rebuild\"\nsubtitle: \"A feature tour of literate-diff on an invented two-repository change\"\n\n# --- Brief -------------------------------------------------------------------\n# Not rendered. Written before any prose, embedded with the sidecar, read by\n# the lint and by anyone interrogating the file: who this is for and why.\nbrief:\n  author: |\n    Wanted the suite to run against the bytes that ship, and to stop carrying\n    long-lived cloud keys in a public repository. Knew the registry could\n    hold an image by digest; did not know whether promotion needed a service.\n  learned: |\n    Promotion needs no service; the registry already holds an image by\n    digest, and two registry settings make promoting it safe.\n  outside_the_record:\n    - Priya's Slack message about the Friday deploy is a note (`ops-slack`).\n  readers:\n    - who: someone setting up a deploy elsewhere\n      knows: Docker, CI; not this registry's tag rules\n      does: copies the pattern, or does not\n      asks: what do I have to set on the registry before promotion is safe?\n    - who: whoever reviews the cloud configuration\n      knows: IAM; not GitHub environments\n      does: signs off on the trust policy, or sends it back\n      asks: who can assume the deploy role now?\n  beats:\n    - the suite runs against the bytes that ship\n    - a deploy is a tag, not a build\n    - the deploy role trusts one environment, not every branch\n\n# --- Sources -----------------------------------------------------------------\n# Evidence. Each has a `type:`; the default is `diff`. Files are addressed as\n# `source:path`. `label:` is the display name.\nsources:\n  app:\n    diff: examples/feature-tour/app.patch\n    label: wren\n    range: prod...main\n  infra:\n    diff: examples/feature-tour/infra.patch\n    label: wren-terraform\n    range: main...deploy-by-digest\n  chat:\n    type: transcript\n    file: conversations.yaml\n    label: the conversation\n  standards:\n    type: doc\n    label: standards\n    files:\n      - path: examples/feature-tour/deploy-standard.md\n        title: The deploy standard this change follows\n  said:\n    type: notes\n    label: things people said\n    items:\n      - id: ops-slack\n        by: Priya\n        on: 2026-03-01\n        where: \"#wren in Slack\"\n        text: |\n          We shipped a build on Friday that the suite had never seen, because\n          the deploy rebuilt from source after the tests passed on a different\n          image. Second time this month.\n      - id: cdn-drain\n        by: Sam\n        text: |\n          Cloudflare answers 524 at about 100 seconds, so an origin drain longer\n          than that waits for clients that have already gone.\n        url: https://developers.cloudflare.com/support/troubleshooting/http-status-codes/cloudflare-5xx-errors/error-524/\n  glossary:\n    type: terms\n    items:\n      - term: digest\n        aliases: [digests]\n        text: |\n          The hash of an image's manifest. It names exactly one set of bytes,\n          where a tag is a movable name that points at whatever it pointed at\n          that day.\n      - term: promotion\n        aliases: [promote, promotes, promoted]\n        text: |\n          Marking an image the suite has passed as deployed by adding a tag to\n          its digest. No copy is made and no second build happens.\n      - term: OIDC\n        text: |\n          OpenID Connect. A CI job presents a signed token stating which\n          repository, branch or environment it runs for, and a cloud role's\n          trust policy says which such subjects may assume it. Replaces\n          long-lived access keys stored as secrets.\n\n# --- Categories --------------------------------------------------------------\n# Kinds of win, for the lists in the wins layer. Colours default to a palette\n# that stays distinguishable under colour-vision deficiency; `color:`\n# overrides, `short:` prefixes the number where colour alone should not carry it.\ncategories:\n  security:    {label: Security, short: S}\n  correctness: {label: Correctness, short: C}\n  reliability: {label: Reliability, short: R}\n  regression:  {label: Regression, short: X, color: \"#555555\"}\n  future:      {label: Future work, short: F, color: \"#BBBBBB\"}\n\n# --- Layers ------------------------------------------------------------------\n# The debrief, top to bottom, in three groups: summary (what the author wants\n# the reader to know), synthesis (why the author believes it), evidence (what\n# happened). `row:` orders rows within a group; the map draws the shape. A\n# title is a noun naming the block; `subtitle:` says what it contains and\n# where it came from. `audience:` and `budget:` are metadata for the brief,\n# the lint and the cold read, shown on hover in the map, not in the header.\n# A prose layer's text is markdown; `{claims}` on the line before a list makes\n# each item a claim that shows what it rests on.\nlayers:\n  - id: summary\n    group: summary\n    title: Executive summary\n    subtitle: What changed, for anyone.\n    audience: anyone\n    budget: 1 minute\n    claims: required\n    text: |\n      {claims}\n      * **The suite runs against the bytes that ship.** CI used to build one\n        image to test and the deploy built another from the same source\n        [](ld:#ops-slack); now it builds one, tests the `test` stage on top of\n        it, and the deploy ships the image that passed [](ldc:#same-bytes).\n      * **A deploy is a tag, not a build**, so it takes seconds rather than\n        minutes and cannot produce something the suite has not seen\n        [](ld:#q-promotion).\n      * **No AWS keys in the workflow.** The job assumes a role through\n        GitHub's OIDC provider, and the trust policy names one environment\n        rather than every branch in the repository [](ld:#cat-oidc)\n        [](ld:#doc-deploy-standard.md).\n\n  - id: builders\n    group: summary\n    row: 2\n    title: Deploy builders\n    subtitle: What to reuse, and the habit to drop, when setting up a deploy elsewhere.\n    audience: someone about to build the next deploy\n    budget: 2 minutes\n    text: |\n      Promotion needs no service: the registry stores an image by digest, so\n      shipping a tested image means adding a tag to a digest that is already\n      there [](ld:#q-promotion). Two registry settings make it safe -- immutable\n      tags, and a lifecycle policy that expires deployed images more slowly\n      than candidates. Drop the habit of copying a settings module in at\n      build time; choose it at runtime and the second Dockerfile goes away\n      [](ld:#q-settings). The [deploy standard](ld:#doc-deploy-standard.md)\n      says the same in four paragraphs.\n\n  - id: iam\n    group: summary\n    row: 2\n    title: IAM reviewers\n    subtitle: The one trust-policy change, and why it is narrower than before.\n    audience: whoever reviews the cloud configuration\n    budget: 1 minute\n    text: |\n      A deploy role whose trust policy names a branch can be assumed from any\n      pushed branch. Name the environment instead [](ldc:#oidc).\n\n  - id: overview\n    group: synthesis\n    title: Overview\n    subtitle: What was true before, what is true now, and the property the change is organised around.\n    audience: a colleague in another role\n    budget: 3 minutes\n    text: |\n      Before this change, every deploy built a fresh image on the `prod`\n      branch and pushed it as `latest`, with production settings copied into\n      the image at build time and long-lived AWS keys in the workflow. The\n      suite never ran against the bytes that shipped, which is how\n      [](ldq:#ops-slack)\n\n      After it, CI builds one image per commit, tests the `test` stage that\n      is built from `prod`, and publishes it tagged with the commit. The\n      deploy resolves that tag to a digest and ships the digest. The registry\n      refuses to move a commit tag, keeps deployed images longer than\n      candidates, and the deploy role trusts one GitHub environment rather\n      than every branch.\n\n      The change was [asked for as a question about testing what\n      ships](ldq:#q-promotion-prompt), and the two properties that make\n      promotion safe [came back with the answer](ld:#q-promotion-response).\n\n  - id: narrative\n    group: synthesis\n    title: Work narrative\n    subtitle: The decisions and turning points, in the order they arrived, from the conversation and the code.\n    audience: someone judging the work\n    budget: 3 minutes\n    text: |\n      **1. Testing what ships** (Monday). Every deploy rebuilt from source on\n      the `prod` branch, so what shipped had never been tested. The answer\n      was that no promotion service was needed, because the registry already\n      stores an image by digest: [](ldq:#p-promotion) *The work moved from\n      building a mechanism to making two registry properties safe.*\n\n      **2. The keys, asked as an aside** (Monday). Noticed in passing rather\n      than planned [](ld:#q-oidc), and answered in the same batch.\n      *Long-lived AWS keys left the workflow.*\n\n      **3. One image for every tier** (Tuesday). The settings module was\n      copied in at build time, which is why there were two Dockerfiles\n      [](ld:#q-settings). *Choosing at runtime removed the second file and\n      let `test` be built from `prod`.*\n\n      The chapters run in dependency order: the registry has to accept\n      immutable tags before the workflow can rely on them.\n\n  - id: improvements\n    group: synthesis\n    title: Improvements\n    subtitle: Every win by kind, each stating what was true before and what is true now.\n    audience: someone reviewing the change\n    budget: 3 minutes\n    text: |\n      Each item recurs as a coloured number where it is delivered; hover the\n      number to see the item, click to come back. Each item lists where it is\n      flagged.\n\n      ### Security\n\n      {category: security}\n      1. {#oidc} Before, the deploy trusted `repo:example/wren:*`, so any\n         branch could assume the deploy role. It now trusts the `prod`\n         environment only.\n      2. {#no-keys} Before, the workflow carried long-lived access keys as\n         repository secrets. It now assumes a role over OIDC.\n      3. {#sha-pins} Before, actions were referenced by tag. They are pinned\n         to a commit SHA.\n\n      ### Correctness\n\n      {category: correctness}\n      1. {#same-bytes} Before, the deploy rebuilt the image, so the bytes\n         tested and the bytes shipped were two builds of the same source. The\n         deploy now promotes the image CI tested, by digest.\n      2. {#runtime-settings} Before, the production settings module was\n         copied over `settings.py` at build time, so one image could only\n         ever be production. The module is named at runtime, and one image\n         boots as any tier.\n\n      ### Reliability\n\n      {category: reliability}\n      1. {#immutable} Before, a re-run could repoint a commit tag at\n         different bytes. Commit tags are immutable; only `latest` moves.\n      2. {#retention} Before, \"keep last 5\" expired the image production was\n         running as soon as five more merges landed. Deployed images now age\n         on their own rule.\n      3. {#health} Before, health checks ran once a minute and old tasks\n         drained for five minutes. Checks run every 15 seconds and the drain\n         is 120, since [the CDN gives up on an origin at about\n         100](ld:#cdn-drain).\n\n  - id: other-side\n    group: synthesis\n    title: Regressions and future work\n    subtitle: What got worse or was traded away, and what is left to do.\n    audience: someone reviewing the change\n    budget: 1 minute\n    text: |\n      ### Regressions\n\n      {category: regression}\n      1. {#first-build} The dev image is no longer pulled, so a first\n         checkout builds it, and a dependency change rebuilds it.\n      2. {#no-maintenance} The maintenance page went with the second target\n         group. There is no maintenance mode until an edge-served one exists.\n\n      ### Future work\n\n      {category: future}\n      1. {#edge-maint} A maintenance page held at the CDN, so it works when\n         the origin is down; see [Regression 2](ld:#cat-no-maintenance).\n      2. {#static} Compiled assets served from a bucket rather than the\n         container, so a rolling deploy cannot 404 on a bundle from the\n         other version.\n\n  - id: vocabulary\n    kind: stream\n    group: synthesis\n    title: Vocabulary\n    subtitle: The terms used above, defined for this change; linked from their first use in each block.\n    sources: [glossary]\n\n  - id: code\n    kind: stream\n    group: evidence\n    title: Code\n    subtitle: The annotated diff across the app and infrastructure repositories, in dependency order.\n    audience: someone reviewing the change line by line\n    sources: [app, infra]\n    hide:\n      - \"**/dist/**\"            # generated output; a bare glob matches in every source\n    collapse:\n      - \"app:requirements.lock\" # rendered, but folded shut\n      - \"app:NOTES\"\n      - \"infra:maintenance-page.png\"\n      - \"infra:variables.tf\"\n    # Titled runs of files in reading order. `*` takes whatever is left.\n    chapters:\n      - id: registry\n        title: \"1. A registry that keeps its promises\"\n        note: |\n          Promotion by digest is only safe if tags cannot move, and only\n          useful if the promoted image survives. Both are properties of the\n          registry, so they come first. The long-lived keys went in the [same\n          sweep](ld:#q-oidc).\n        files:\n          - infra:ecr.tf\n          - infra:iam.tf\n      - id: image\n        title: \"2. One image for every tier\"\n        note: |\n          The Dockerfile and the settings selector. Nothing in the workflow\n          can promote an artifact until there is one artifact.\n        files:\n          - app:Dockerfile\n          - app:app/__init__.py\n          - app:app/settings.py\n          - app:app/settings_prod.py\n      - id: deploy\n        title: \"3. The deploy stops building\"\n        note: |\n          With the two chapters above in place, the workflow can resolve a\n          tag to a digest and ship it. This is the only file where the change\n          is visible as a change in what the service does.\n        files:\n          - app:.github/workflows/deploy.yml\n          - infra:ingress.tf\n          - infra:maintenance.tf\n      - title: \"Housekeeping\"\n        note: |\n          Dependency bumps, the README, a binary, and generated output.\n          Folded shut; the lock file and the binary are here for\n          completeness.\n        files:\n          - \"*\"\n\n  - id: conversation\n    kind: stream\n    group: evidence\n    title: Conversation\n    subtitle: The prompts and replies the decisions turned on, in order, across two sessions.\n    audience: someone following how a decision was reached\n    sources: [chat]\n    note: |\n      Four turns of an invented conversation, interleaved by time across two\n      sessions: the part of each prompt and reply the decision turned on,\n      with the rest one click away, and a band of counts where the work\n      itself was.\n    # Chapters here are the subject, not the session: the stream is\n    # chronological, so a chapter is fixed by the turn it opens at.\n    chapters:\n      - id: mechanism\n        at: promotion:t0302-0914\n        title: \"Deciding to promote rather than rebuild\"\n      - id: runtime\n        at: aside:t0303-0900\n        title: \"One image for every tier\"\n\n  - id: references\n    kind: stream\n    group: evidence\n    title: Standards and statements\n    subtitle: The deploy standard this follows, and what people said outside the record.\n    audience: someone checking what a claim rests on\n    sources: [standards, said]\n\n# --- Files -------------------------------------------------------------------\n# Per-file annotations for the diff sources. (`items:` under a layer is the\n# same thing; this key is the older spelling and still works.)\nfiles:\n  infra:ecr.tf:\n    title: immutable tags, split retention\n    note: |\n      The two registry properties the rest of the change depends on\n      [](ldc:#immutable) [](ldc:#retention). The deploy's\n      [resolve step](ld:#resolve) is what reads them.\n    sections:\n      - at: \"Two populations age at different rates\"\n        id: retention-split\n        title: \"Deployed images and build candidates on separate rules\"\n        note: |\n          A single count cannot serve both: sized for candidate churn it\n          expires images still in service, sized for deployments it keeps\n          every candidate forever.\n    notes:\n      - at: \"IMMUTABLE_WITH_EXCLUSION\"\n        span: 5\n        text: |\n          Commit tags cannot be repointed; `latest` can, because the task\n          definition Terraform writes still names it.\n      - at: \"tagPrefixList\"\n        span: 1\n        text: |\n          The `deployed-` prefix a deploy writes. An image claimed by a lower\n          rule number is exempt from every later rule.\n      - at: '\"keep last 5 images\"'\n        span: 1\n        text: |\n          What was there before: five images, any tag, which is about two\n          deploys of history.\n\n  infra:iam.tf:\n    title: who may deploy\n    note: |\n      One trust-policy condition [](ldc:#oidc). The old wildcard is\n      [quoted here](ldq:#old-subject) so the reader need not scroll.\n    anchors:\n      - id: old-subject\n        at: \"StringLike\"\n        span: 1\n    notes:\n      - at: \"environment:prod\"\n        span: 1\n        text: |\n          A job that names a GitHub environment presents `environment:\u003cname>`\n          as its subject, so the environment's branch policy decides who\n          reaches this role.\n\n  app:Dockerfile:\n    title: four stages, one build graph\n    collapsed: false\n    note: |\n      `test` is built from `prod`, so the suite runs against the layers that\n      ship [](ldc:#same-bytes). Settings are chosen at runtime\n      [](ldc:#runtime-settings), which is what lets one image be both the\n      test target and the production artifact.\n    sections:\n      - at: \"FROM base AS prod\"\n        id: stage-prod\n        title: \"prod: the artifact that ships\"\n      - at: \"FROM prod AS test\"\n        id: stage-test\n        title: \"test: what CI runs the suite against\"\n        note: |\n          Everything below `prod` is test toolchain. The bytes above it are\n          exactly what production runs.\n      - at: \"FROM base AS dev\"\n        title: \"dev: built locally, working tree mounted over it\"\n        note: |\n          Built on a laptop rather than pulled [](ldc:#first-build).\n    notes:\n      - at: \"RUN cp app/settings_prod.py app/settings.py\"\n        span: 1\n        id: bake-settings\n        text: |\n          The line that made the old image production-only. Anchors match\n          row text without the leading `+` or `-`.\n      - at: \"ENV WREN_SETTINGS_MODULE=settings_prod\"\n        span: 1\n        text: |\n          The default, overridable by CI for the same image; see\n          [the selector](ld:#file-app-app-__init__.py).\n\n  app:app/__init__.py:\n    title: the settings selector\n    note: |\n      Reads the module name from the environment [](ldc:#runtime-settings).\n      Replaces the [copy at build time](ldq:#bake-settings).\n    notes:\n      - at: \"/settings_dev/\"\n        span: 1\n        text: |\n          A regex anchor. The fallback for a developer's checkout, where the\n          variable is unset.\n\n  app:app/settings.py:\n    note: |\n      The file the old Dockerfile overwrote. Nothing reads it now.\n\n  app:app/settings_prod.py:\n    note: |\n      Static files move to a bucket [](ldc:#static); only `STATIC_URL`\n      changes here.\n    notes:\n      - at: \"+4\"\n        span: 1\n        text: |\n          Anchored by new-side line number: line 4 of the new file.\n\n  app:.github/workflows/deploy.yml:\n    title: promote, do not rebuild\n    collapsed: false\n    note: |\n      The payoff. The build step is gone; the deploy resolves the commit's\n      tag to a digest [](ldc:#same-bytes) and ships that. Authenticated by\n      OIDC [](ldc:#no-keys), on a pinned action [](ldc:#sha-pins).\n    sections:\n      - at: \"Promote, do not rebuild: resolve the commit's tag to a digest\"\n        id: resolve\n        title: \"Resolve the tested image\"\n        note: |\n          Digests, not tags, wherever the choice exists. This only works\n          because [the registry](ld:#retention-split) keeps the image and\n          refuses to move the tag.\n    notes:\n      - at: \"AWS_ACCESS_KEY_ID\"\n        span: 2\n        text: |\n          Long-lived keys, removed [](ldc:#no-keys).\n      - at: \"environment: prod\"\n        span: 1\n        text: |\n          Naming the environment is what changes the OIDC subject the\n          [trust policy](ld:#file-infra-iam.tf) matches [](ldc:#oidc).\n      - at: \"uses: actions/checkout@\"\n        nth: 2\n        span: 1\n        text: |\n          Pinned to a commit, with the version in a comment for humans\n          [](ldc:#sha-pins). `nth: 2` picks the added row over the removed\n          one above it, which matches the same text.\n      - at: \"docker build -t\"\n        through: \"docker push\"\n        text: |\n          The build at deploy time, gone. `through:` extends this note to the\n          next matching row.\n\n  infra:ingress.tf:\n    title: faster checks, shorter drain\n    note: |\n      Renamed from `alb.tf`; the badge says so. Timing changes only\n      [](ldc:#health).\n    notes:\n      - at: \"interval = 15\"\n        span: 2\n        text: |\n          Healthy threshold times interval is the floor on time-to-healthy.\n      - at: \"deregistration_delay\"\n        span: 1\n        text: |\n          [](ldq:#cdn-drain)\n\n  infra:maintenance.tf:\n    title: the maintenance page, removed\n    note: |\n      Two always-on resources serving nothing, gone [](ldc:#no-maintenance).\n      The edge-served replacement is [future work](ld:#cat-edge-maint).\n    notes:\n      - at: \"@0\"\n        span: 1\n        text: |\n          Anchored by row index: the first row of this file's diff, whatever\n          it is.\n\n  app:README.md:\n    note: |\n      What a developer sees [](ldc:#first-build).\n    notes:\n      - at: \"-5\"\n        span: 1\n        text: |\n          Anchored by old-side line number: line 5 of the old file, the\n          sentence that no longer holds.\n\n  app:requirements.txt:\n    note: |\n      A dependency bump that rides along.\n\n  app:requirements.lock:\n    note: |\n      Collapsed by the `collapse:` list, since nobody reads a lock file.\n\n  app:NOTES:\n    note: |\n      A file with no newline at the end; the marker renders as a message row.\n\n  infra:maintenance-page.png:\n    note: |\n      A binary; the payload is not shown.\n\n  infra:variables.tf:\n    note: |\n      New, and folded shut.\n\n# --- Turns -------------------------------------------------------------------\n# Per-turn annotations for the transcript source. A turn is addressed as\n# `thread:turn`; the highlight (`prompt:`/`response:`) is the part that\n# shows, and may be several passages.\nthreads:\n  promotion:\n    note: |\n      Two sessions, the second resumed after the first was compacted.\n  aside:\n    note: |\n      A separate session, opened to check one thing.\n\nturns:\n  promotion:t0302-0914:\n    id: q-promotion\n    prompt: {at: \"How hard is it to test one image\"}\n    response:\n      - {at: \"Promotion is a tag, not a copy\"}\n      - {at: \"The work is in the two things\", through: \"before you need it\"}\n    anchors:\n      - {id: p-promotion, at: \"Promotion is a tag, not a copy\", in: response}\n\n  promotion:t0302-1042:\n    id: q-oidc\n    note: |\n      Asked as an aside, and answered in the same batch.\n    prompt: {at: \"the workflow has AWS keys\"}\n    response: {at: \"the trust policy names one environment\"}\n\n  promotion:t0303-1530:\n    id: q-settings\n    prompt: {at: \"Can the image choose at runtime?\"}\n    response: {at: \"it removes the second Dockerfile\"}\n    anchors:\n      - {id: q-settings-why, at: \"the `test` stage can be built from `prod`\", in: response}\n","brief":{"author":"Wanted the suite to run against the bytes that ship, and to stop carrying\nlong-lived cloud keys in a public repository. Knew the registry could\nhold an image by digest; did not know whether promotion needed a service.\n","learned":"Promotion needs no service; the registry already holds an image by\ndigest, and two registry settings make promoting it safe.\n","outside_the_record":["Priya's Slack message about the Friday deploy is a note (`ops-slack`)."],"readers":[{"who":"someone setting up a deploy elsewhere","knows":"Docker, CI; not this registry's tag rules","does":"copies the pattern, or does not","asks":"what do I have to set on the registry before promotion is safe?"},{"who":"whoever reviews the cloud configuration","knows":"IAM; not GitHub environments","does":"signs off on the trust policy, or sends it back","asks":"who can assume the deploy role now?"}],"beats":["the suite runs against the bytes that ship","a deploy is a tag, not a build","the deploy role trusts one environment, not every branch"]},"claims":[{"id":"claim-1","category":"","n":1,"text":"The suite runs against the bytes that ship. CI used to build one\nimage to test and the deploy built another from the same source\n; now it builds one, tests the test stage on top of\nit, and the deploy ships the image that passed .","layer":"summary","cites":["ops-slack","same-bytes"],"flagged_from":[],"evidence":["attestation","diff"],"supported":true},{"id":"claim-2","category":"","n":2,"text":"A deploy is a tag, not a build, so it takes seconds rather than\nminutes and cannot produce something the suite has not seen\n.","layer":"summary","cites":["q-promotion"],"flagged_from":[],"evidence":["conversation"],"supported":true},{"id":"claim-3","category":"","n":3,"text":"No AWS keys in the workflow. The job assumes a role through\nGitHub's OIDC provider, and the trust policy names one environment\nrather than every branch in the repository \n.","layer":"summary","cites":["cat-oidc","doc-deploy-standard.md"],"flagged_from":[],"evidence":["diff","document"],"supported":true},{"id":"oidc","category":"security","n":1,"text":"Before, the deploy trusted repo:example/wren:*, so any\nbranch could assume the deploy role. It now trusts the prod\nenvironment only.","layer":"improvements","cites":[],"flagged_from":["IAM reviewers","iam.tf","deploy.yml"],"evidence":["diff"],"supported":true},{"id":"no-keys","category":"security","n":2,"text":"Before, the workflow carried long-lived access keys as\nrepository secrets. It now assumes a role over OIDC.","layer":"improvements","cites":[],"flagged_from":["deploy.yml","deploy.yml"],"evidence":["diff"],"supported":true},{"id":"sha-pins","category":"security","n":3,"text":"Before, actions were referenced by tag. They are pinned\nto a commit SHA.","layer":"improvements","cites":[],"flagged_from":["deploy.yml","deploy.yml"],"evidence":["diff"],"supported":true},{"id":"same-bytes","category":"correctness","n":1,"text":"Before, the deploy rebuilt the image, so the bytes\ntested and the bytes shipped were two builds of the same source. The\ndeploy now promotes the image CI tested, by digest.","layer":"improvements","cites":[],"flagged_from":["Executive summary","Dockerfile","deploy.yml"],"evidence":["diff"],"supported":true},{"id":"runtime-settings","category":"correctness","n":2,"text":"Before, the production settings module was\ncopied over settings.py at build time, so one image could only\never be production. The module is named at runtime, and one image\nboots as any tier.","layer":"improvements","cites":[],"flagged_from":["Dockerfile","__init__.py"],"evidence":["diff"],"supported":true},{"id":"immutable","category":"reliability","n":1,"text":"Before, a re-run could repoint a commit tag at\ndifferent bytes. Commit tags are immutable; only latest moves.","layer":"improvements","cites":[],"flagged_from":["ecr.tf"],"evidence":["diff"],"supported":true},{"id":"retention","category":"reliability","n":2,"text":"Before, &quot;keep last 5&quot; expired the image production was\nrunning as soon as five more merges landed. Deployed images now age\non their own rule.","layer":"improvements","cites":[],"flagged_from":["ecr.tf"],"evidence":["diff"],"supported":true},{"id":"health","category":"reliability","n":3,"text":"Before, health checks ran once a minute and old tasks\ndrained for five minutes. Checks run every 15 seconds and the drain\nis 120, since the CDN gives up on an origin at about\n100.","layer":"improvements","cites":["cdn-drain"],"flagged_from":["ingress.tf"],"evidence":["reference","diff"],"supported":true},{"id":"first-build","category":"regression","n":1,"text":"The dev image is no longer pulled, so a first\ncheckout builds it, and a dependency change rebuilds it.","layer":"other-side","cites":[],"flagged_from":["dev: built locally, working tree mounted over it","README.md"],"evidence":["diff"],"supported":true},{"id":"no-maintenance","category":"regression","n":2,"text":"The maintenance page went with the second target\ngroup. There is no maintenance mode until an edge-served one exists.","layer":"other-side","cites":[],"flagged_from":["maintenance.tf"],"evidence":["diff"],"supported":true},{"id":"edge-maint","category":"future","n":1,"text":"A maintenance page held at the CDN, so it works when\nthe origin is down; see Regression 2.","layer":"other-side","cites":["cat-no-maintenance"],"flagged_from":[],"evidence":["diff"],"supported":true},{"id":"static","category":"future","n":2,"text":"Compiled assets served from a bucket rather than the\ncontainer, so a rolling deploy cannot 404 on a bundle from the\nother version.","layer":"other-side","cites":[],"flagged_from":["settings_prod.py"],"evidence":["di       html.push(tr.outerHTML);
    });
    body.innerHTML = html.join("");
    return true;
  }

  function fillFor(id) {
    // `id` may name a row inside a file that has not been built yet.
    var key = /^(f\d+)/.exec(id);
    if (!key) return;
    var block = document.querySelector('[data-ld-lazy="' + key[1] + '"]');
    if (block) fill(block);
  }

  function rowIndex(note) {
    var m = /-r(\d+)$/.exec(note.dataset.ldRow || "");
    return m ? parseInt(m[1], 10) : 0;
  }

  function rowsFor(targetId) {
    var a = ANCHORS[targetId];
    if (!a) return [];
    fillFor(a.body);
    var out = [];
    for (var i = a.start; i <= a.end; i++) {
      var el = document.getElementById(a.body + "-r" + i);
      if (el) out.push(el);
    }
    return out;
  }

  /* --- sidenote placement -------------------------------------------------- */

  function placeNotes() {
    var wide = !NARROW.matches;
    document.querySelectorAll(".ld-file").forEach(function (file) {
      var gutter = file.querySelector(".ld-gutter");
      if (!gutter) return;
      var notes = Array.prototype.slice.call(file.querySelectorAll(".ld-note"));
      if (!notes.length) return;

      if (!wide) {
        // Narrow: fold each note into the table, just below the line it is
        // about, rather than stacking them all after the diff.
        notes.forEach(function (note) {
          var row = document.getElementById(note.dataset.ldRow);
          if (!row) return;
          var host = note.parentElement;
          if (host && host.classList.contains("ld-noterow-cell")) return;
          var tr = document.createElement("tr");
          tr.className = "ld-noterow";
          var td = document.createElement("td");
          td.className = "ld-noterow-cell";
          td.colSpan = 3;
          td.appendChild(note);
          tr.appendChild(td);
          row.after(tr);
          note.style.top = "";
        });
        gutter.style.minHeight = "";
        return;
      }

      // Wide: notes belong in the margin. Undo any inline folding.
      notes.forEach(function (note) {
        var cell = note.parentElement;
        if (cell && cell.classList.contains("ld-noterow-cell")) {
          gutter.appendChild(note);
          var tr = cell.parentElement;
          if (tr) tr.remove();
        }
      });
      // Place in anchor order, so the push-down below never runs backwards.
      notes.sort(function (a, b) { return rowIndex(a) - rowIndex(b); });
      notes.forEach(function (n) { gutter.appendChild(n); });
      var gTop = gutter.getBoundingClientRect().top;
      var floor = 0;
      notes.forEach(function (note) {
        var row = document.getElementById(note.dataset.ldRow);
        if (!row) return;
        var want = row.getBoundingClientRect().top - gTop;
        var top = Math.max(want, floor);
        note.style.top = top + "px";
        floor = top + note.offsetHeight + 12;
      });
      // Keep the gutter tall enough that stacked notes are not clipped.
      gutter.style.minHeight = floor + "px";
    });
  }

  var raf = null;
  function schedulePlace() {
    // requestAnimationFrame does not fire while the document is hidden, which
    // would leave notes unplaced in a background tab until it is next shown.
    if (document.hidden) {
      placeNotes();
      return;
    }
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () { raf = null; placeNotes(); });
  }
  document.addEventListener("visibilitychange", schedulePlace);
  window.ldPlaceNotes = placeNotes;

  /* --- navigation ---------------------------------------------------------- */

  function reveal(targetId) {
    fillFor(targetId);
    var rows = rowsFor(targetId);
    var el = document.getElementById(targetId);
    var focus = rows[0] || el;
    if (!focus) return;

    var block = focus.closest("details.ld-fileblock");
    if (block && !block.open) {
      block.open = true;
      placeNotes();
    }
    var msg = focus.closest(".ld-msg");
    if (msg && focus.classList.contains("ld-elided")) openMessage(msg, true);
    // Centre a line, but put the top of anything taller than the window at the
    // top: centring a section that is longer than the viewport lands the reader
    // in the middle of it, which is nowhere in particular.
    var tall = focus.getBoundingClientRect().height > window.innerHeight * 0.8;
    focus.scrollIntoView({ block: tall ? "start" : "center" });

    document.querySelectorAll(".ld-flash").forEach(function (n) {
      n.classList.remove("ld-flash");
    });
    // Flashing something taller than the window tints the whole screen, which
    // points at nothing. Landing at its top is the cue.
    var flash = rows.length ? rows : el && !tall ? [el] : [];
    flash.forEach(function (n) {
      n.classList.remove("ld-flash");
      void n.offsetWidth;
      n.classList.add("ld-flash");
    });
    if (el && el.classList.contains("ld-note")) {
      document.querySelectorAll(".ld-note-active").forEach(function (n) {
        n.classList.remove("ld-note-active");
      });
      el.classList.add("ld-note-active");
    }
  }

  function openMessage(msg, open) {
    msg.classList.toggle("is-open", open);
    var btn = msg.querySelector(".ld-msg-more");
    if (btn) {
      btn.setAttribute("aria-expanded", String(open));
      btn.textContent = open ? "show less" : btn.dataset.ldLabel;
    }
  }

  document.querySelectorAll(".ld-msg-more").forEach(function (btn) {
    btn.dataset.ldLabel = btn.textContent;
  });

  document.addEventListener("click", function (ev) {
    var more = ev.target.closest(".ld-msg-more");
    if (more) {
      ev.preventDefault();
      var msg = more.closest(".ld-msg");
      openMessage(msg, !msg.classList.contains("is-open"));
      return;
    }
    var jump = ev.target.closest("[data-ld-target]");
    if (jump && !jump.classList.contains("ld-quote-btn")) {
      ev.preventDefault();
      var id = jump.dataset.ldTarget;
      history.replaceState(null, "", "#" + id);
      reveal(id);
      return;
    }
    var btn = ev.target.closest(".ld-quote-btn");
    if (btn) {
      ev.preventDefault();
      var body = btn.nextElementSibling;
      if (!body) return;
      var open = body.hasAttribute("hidden");
      body.toggleAttribute("hidden", !open);
      btn.setAttribute("aria-expanded", String(open));
      schedulePlace();
    }
  });

  document.addEventListener("toggle", function (ev) {
    if (ev.target.classList && ev.target.classList.contains("ld-fileblock")) {
      if (ev.target.open) fill(ev.target);
      schedulePlace();
    }
  }, true);

  /* --- hovering a marked line highlights its notes -------------------------- */

  document.addEventListener("mouseover", function (ev) {
    var row = ev.target.closest && ev.target.closest(".ld-marked");
    if (!row) return;
    document.querySelectorAll(".ld-note-active").forEach(function (n) {
      n.classList.remove("ld-note-active");
    });
    (row.dataset.ldNotes || "").split(",").forEach(function (id) {
      var n = document.getElementById(id);
      if (n) n.classList.add("ld-note-active");
    });
  });

  /* --- category flags: hover shows the item being cited ---------------------- */

  var tip = null;
  function hideTip() {
    if (tip) { tip.remove(); tip = null; }
    document.querySelectorAll(".ld-flag-active").forEach(function (n) {
      n.classList.remove("ld-flag-active");
    });
  }
  function showTip(flag) {
    hideTip();
    var item = document.getElementById(flag.dataset.ldTarget);
    if (!item) return;
    var body = item.cloneNode(true);
    body.querySelectorAll(".ld-cat-badge, .ld-cat-where").forEach(function (n) { n.remove(); });
    body.removeAttribute("id");
    tip = document.createElement("div");
    tip.className = "ld-cat-tip";
    tip.style.cssText = flag.style.cssText;
    var head = document.createElement("div");
    head.className = "ld-cat-tip-head";
    head.textContent = (flag.getAttribute("title") || "").split(":")[0];
    tip.appendChild(head);
    var content = document.createElement("div");
    content.innerHTML = body.innerHTML;
    tip.appendChild(content);
    document.body.appendChild(tip);
    var r = flag.getBoundingClientRect();
    var left = r.left + window.scrollX;
    var maxLeft = window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 12;
    tip.style.left = Math.max(window.scrollX + 8, Math.min(left, maxLeft)) + "px";
    tip.style.top = (r.bottom + window.scrollY + 8) + "px";
    flag.classList.add("ld-flag-active");
    // The title attribute is kept for accessibility; suppress
    // the browser's own tooltip while ours is showing.
    flag.dataset.ldTitle = flag.getAttribute("title");
    flag.removeAttribute("title");
  }
  document.addEventListener("mouseover", function (ev) {
    var flag = ev.target.closest && ev.target.closest(".ld-cat-flag");
    if (flag) showTip(flag);
  });
  document.addEventListener("mouseout", function (ev) {
    var flag = ev.target.closest && ev.target.closest(".ld-cat-flag");
    if (!flag) return;
    if (flag.dataset.ldTitle) {
      flag.setAttribute("title", flag.dataset.ldTitle);
      delete flag.dataset.ldTitle;
    }
    hideTip();
  });
  document.addEventListener("scroll", hideTip, true);

  /* --- table of contents current-file tracking ------------------------------ */

  function trackToc() {
    var files = document.querySelectorAll(".ld-file, .ld-thread");
    if (!files.length || !("IntersectionObserver" in window)) return;
    var links = {};
    document.querySelectorAll(".ld-toc-file > a").forEach(function (a) {
      links[a.dataset.ldTarget] = a.parentElement;
    });
    var seen = new Set();
    var obs = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) seen.add(e.target.id);
          else seen.delete(e.target.id);
        });
        Object.keys(links).forEach(function (id) {
          links[id].classList.toggle("ld-current", seen.has(id));
        });
      },
      { rootMargin: "-10% 0px -70% 0px" }
    );
    files.forEach(function (f) { obs.observe(f); });
  }

  /* --- the map: which layer the reader is in ------------------------------- */

  function trackMap() {
    var blocks = document.querySelectorAll(".ld-map-box");
    if (!blocks.length || !("IntersectionObserver" in window)) return;
    // The full-size map and the postage stamp share layer ids; mark both.
    var byId = {};
    blocks.forEach(function (b) { (byId[b.dataset.ldLayer] = byId[b.dataset.ldLayer] || []).push(b); });
    var seen = new Set();
    var obs = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) seen.add(e.target.id);
          else seen.delete(e.target.id);
        });
        var current = null;
        Object.keys(byId).forEach(function (id) {
          if (seen.has(id) && current === null) current = id;
        });
        Object.keys(byId).forEach(function (id) {
          byId[id].forEach(function (b) { b.classList.toggle("ld-current", id === current); });
        });
      },
      { rootMargin: "-5% 0px -60% 0px" }
    );
    Object.keys(byId).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) obs.observe(el);
    });
  }

  /* --- the data block, for page scripts and the console -------------------- */

  window.LD.anchors = ANCHORS;
  window.LD.reveal = reveal;

  /* --- boot ---------------------------------------------------------------- */

  function boot() {
    placeNotes();
    trackToc();
    trackMap();
    if (location.hash.length > 1) reveal(location.hash.slice(1));
  }

  window.addEventListener("resize", schedulePlace);
  window.addEventListener("hashchange", function () {
    if (location.hash.length > 1) reveal(location.hash.slice(1));
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(schedulePlace);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body></html>
