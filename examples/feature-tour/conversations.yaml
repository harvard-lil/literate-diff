  - id: aside
    title: "Checking what the registry charges for"
    sessions: [cccc3333]
    turns:
      - id: t0303-0900
        at: 2026-03-03T09:00:00Z
        prompt: |-
          Separate question, asked here so it doesn't drag the other session
          around: if we keep every commit's image, what does that cost?
        response: |-
          Not much, and the lifecycle policy is the lever.

          | population | rule | kept |
          |---|---|---|
          | candidates | `sha-` prefix | 30 |
          | deployed | `staging-`, `prod-` | 100 |

          At h2o's image size that is roughly **$2.50 a month**, which is
          below the noise floor of the account. The reason to expire anything
          is not cost; it is that an unbounded repository makes `describe-images`
          slow enough to time out in the deploy.
        work: {seconds: 61, tokens: 1180}
        tools: {Bash: 4}
