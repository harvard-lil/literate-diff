  - id: promotion
    title: "Promoting an image instead of rebuilding it"
    sessions: [aaaa1111, bbbb2222]
    turns:
      - id: t0302-0914
        at: 2026-03-02T09:14:00Z
        session: aaaa1111
        prompt: |-
          Every deploy rebuilds from source on the prod branch, so what ships
          has never been tested. How hard is it to test one image and then ship
          that same image? I don't want to invent a promotion service for it.
        response: |-
          Not hard, and no service is needed. Promotion is a tag, not a copy:
          the registry already stores the image by digest, so "promote" means
          adding a second tag to a digest that is already there.

          The work is in the two things that make that safe. Tags have to be
          immutable, or a commit tag can be moved under you between test and
          deploy. And the lifecycle policy has to expire deployed images more
          slowly than candidates, or the thing you want to roll back to is
          collected before you need it.
        work: {seconds: 214, tokens: 4120}
        tools: {Bash: 12, Read: 4}
        narration:
          - |-
            Reading the workflow and the registry configuration first.

      - id: t0302-1042
        at: 2026-03-02T10:42:00Z
        session: aaaa1111
        prompt: |-
          Do it, and while you're in there the workflow has AWS keys in it.
          Can those go?
        response: |-
          Gone. The job now assumes a role through the GitHub OIDC provider,
          and the trust policy names one environment rather than every ref in
          the repository, so a workflow on a pushed branch cannot assume it.
        work: {seconds: 431, tokens: 8830}
